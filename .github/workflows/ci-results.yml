name: RomeLegions CI Results

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      profile:
        description: Validation scope (auto uses changed inputs)
        type: choice
        options:
          - auto
          - full
        default: auto
      reason:
        description: Required reason for full validation
        type: string

permissions:
  contents: read

env:
  CI_VERSION: v0.81
  PROJECT_NAME: RomeLegions
  XCODE_PROJECT: RomeLegionsApp.xcodeproj
  XCODE_SCHEME: RomeLegions
  XCODE_DESTINATION: generic/platform=iOS
  DERIVED_DATA_PATH: .derivedData-ci
  RESULT_BUNDLE_PATH: ci-results/RomeLegions.xcresult

jobs:
  build-test:
    name: Build, Test, and Package Results
    runs-on: macos-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare result directory
        run: |
          mkdir -p ci-results .home .build/module-cache

      - name: Select related validation
        id: scope
        env:
          CI_DIFF_BASE: ${{ github.event.before }}
          CI_PROFILE: ${{ inputs.profile || 'auto' }}
          CI_REASON: ${{ inputs.reason }}
        run: node Tools/ci_scope.mjs

      - name: Static checks
        id: static_checks
        continue-on-error: true
        shell: bash
        env:
          BASE_SHA: ${{ steps.scope.outputs.base_sha }}
          CI_CONTRACTS: ${{ steps.scope.outputs.ci_contracts }}
        run: |
          set -eo pipefail
          {
            if [ -n "$BASE_SHA" ]; then
              git diff --check "$BASE_SHA" "$GITHUB_SHA"
            else
              git diff --check "$(git hash-object -t tree --stdin </dev/null)" "$GITHUB_SHA"
            fi
            plutil -lint "$XCODE_PROJECT/project.pbxproj"
            node Tools/verify_project.mjs
            if [ "$CI_CONTRACTS" = "true" ]; then
              node --test Tools/ci_scope.test.mjs
            fi
          } 2>&1 | tee ci-results/static-checks.log

      - name: SwiftPM tests
        id: swift_tests
        if: steps.scope.outputs.swift_tests == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          env HOME="$PWD/.home" \
            CLANG_MODULE_CACHE_PATH="$PWD/.build/module-cache" \
            swift test --scratch-path .build/swift-test-ci --disable-sandbox \
            2>&1 | tee ci-results/swift-test.log

      - name: Gameplay smoke
        id: gameplay_smoke
        if: steps.scope.outputs.gameplay_smoke == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -eo pipefail
          {
            swiftc -swift-version 5 \
              -module-cache-path .build/module-cache \
              Sources/RomeLegionsCore/GameState.swift \
              Tools/GameplaySmoke/main.swift \
              -o .build/gameplay-smoke
            .build/gameplay-smoke
          } 2>&1 | tee ci-results/gameplay-smoke.log

      - name: Render battle preview
        id: render_preview
        if: steps.scope.outputs.render_preview == 'true'
        timeout-minutes: 50
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            mkdir -p ci-results/render-previews
            mkdir -p .home .build/module-cache
            MACOS_SDK="$(xcrun --sdk macosx --show-sdk-path)"
            ARCH="$(uname -m)"
            echo "[preview] compiler started $(date -u)"
            env HOME="$PWD/.home" CLANG_MODULE_CACHE_PATH="$PWD/.build/module-cache" swiftc -parse-as-library \
              -O \
              -swift-version 5 \
              -Xfrontend -warn-long-function-bodies -Xfrontend 1000 \
              -Xfrontend -warn-long-expression-type-checking -Xfrontend 500 \
              -sdk "$MACOS_SDK" \
              -target "${ARCH}-apple-macosx14.0" \
              -module-cache-path .build/module-cache \
              -o .build/render-battle-preview \
              Tools/RenderBattlePreview/main.swift \
              Sources/RomeLegionsCore/GameState.swift \
              RomeLegionsApp/App/GameViewModelMapReadouts.swift \
              RomeLegionsApp/App/GameViewModelStrategyReadouts.swift \
              RomeLegionsApp/App/GameViewModelSelectionReadouts.swift \
              RomeLegionsApp/App/GameViewModel.swift \
              RomeLegionsApp/Views/BattleView.swift \
              RomeLegionsApp/Views/BattleShellControls.swift \
              RomeLegionsApp/Views/BattleMapView.swift \
              RomeLegionsApp/Views/BattlePanels.swift \
              RomeLegionsApp/Views/BattleViewStyles.swift || exit $?
            echo "[preview] compiler completed $(date -u)"
            export ROMELEGIONS_ART_ROOT="$PWD/RomeLegionsApp/Resources/BattleUnitArt"
            .build/render-battle-preview ci-results/render-previews/battle-landscape-preview.png 932 430 --unit-art-sheet || exit $?
            .build/render-battle-preview ci-results/render-previews/battle-portrait-preview.png 390 844 || exit $?
            .build/render-battle-preview ci-results/render-previews/battle-wide-preview.png 1024 768 || exit $?
          } 2>&1 | tee ci-results/render-battle-preview.log

      - name: Xcode build
        id: xcode_build
        if: steps.scope.outputs.xcode_build == 'true'
        timeout-minutes: 15
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -destination "$XCODE_DESTINATION" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -resultBundlePath "$RESULT_BUNDLE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            build || exit $?
          APP_PACKAGE="$DERIVED_DATA_PATH/Build/Products/Debug-iphoneos/RomeLegions.app"
          for kind in legion cavalry archer navy; do
            cmp "RomeLegionsApp/Resources/BattleUnitArt/$kind.png" "$APP_PACKAGE/BattleUnitArt/$kind.png" || exit $?
            echo "[art] bundled $kind.png matches source"
          done
          } 2>&1 | tee ci-results/xcodebuild.log

      - name: Generate CI result metadata
        id: metadata
        if: always()
        shell: bash
        env:
          SCOPE_OUTCOME: ${{ steps.scope.outcome }}
          STATIC_OUTCOME: ${{ steps.static_checks.outcome }}
          SWIFT_TESTS_OUTCOME: ${{ steps.swift_tests.outcome }}
          GAMEPLAY_SMOKE_OUTCOME: ${{ steps.gameplay_smoke.outcome }}
          RENDER_PREVIEW_OUTCOME: ${{ steps.render_preview.outcome }}
          XCODE_BUILD_OUTCOME: ${{ steps.xcode_build.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { checks, evaluateChecks, selectScope } from "./Tools/ci_scope.mjs";

          const env = process.env;
          const scopePath = "ci-results/validation-scope.json";
          const scope = fs.existsSync(scopePath)
            ? JSON.parse(fs.readFileSync(scopePath, "utf8"))
            : selectScope([], { baselineAvailable: false, headSha: env.GITHUB_SHA });
          fs.writeFileSync(scopePath, JSON.stringify(scope, null, 2) + "\n");
          const branch = env.GITHUB_REF_NAME || "";
          const shortSha = (env.GITHUB_SHA || "").slice(0, 7);
          const branchSlug = branch.replace(/[^A-Za-z0-9._-]+/g, "-");
          const artifactName = `${env.PROJECT_NAME}-ci-${env.CI_VERSION}-${branchSlug}-${shortSha}-run${env.GITHUB_RUN_ID}-attempt${env.GITHUB_RUN_ATTEMPT}`;
          const outcomes = Object.fromEntries(checks.map((check) => [check.outcome, env[check.env] || "skipped"]));
          const results = evaluateChecks(scope, outcomes);
          const expectedRenderPaths = [
            "ci-results/render-previews/battle-landscape-preview.png",
            "ci-results/render-previews/battle-landscape-preview-unit.png",
            "ci-results/render-previews/battle-landscape-preview-focused.png",
            "ci-results/render-previews/battle-landscape-preview-focused-enemy.png",
            "ci-results/render-previews/battle-landscape-preview-focused-countermeasure.png",
            "ci-results/render-previews/battle-portrait-preview.png",
            "ci-results/render-previews/battle-portrait-preview-unit.png",
            "ci-results/render-previews/battle-portrait-preview-focused.png",
            "ci-results/render-previews/battle-portrait-preview-focused-enemy.png",
            "ci-results/render-previews/battle-portrait-preview-focused-countermeasure.png",
            "ci-results/render-previews/battle-wide-preview.png",
            "ci-results/render-previews/battle-wide-preview-unit.png",
            "ci-results/render-previews/battle-wide-preview-focused.png",
            "ci-results/render-previews/battle-wide-preview-focused-enemy.png",
            "ci-results/render-previews/battle-wide-preview-focused-countermeasure.png",
            "ci-results/render-previews/battle-unit-art-preview.png"
          ];
          for (const result of results) {
            const expected = [result.log];
            if (result.id === "render-battle-preview") expected.push(...expectedRenderPaths);
            if (result.id === "xcode-build") expected.push(env.RESULT_BUNDLE_PATH);
            result.missingPaths = result.selected ? expected.filter((file) => !fs.existsSync(file)) : [];
            if (result.selected && (result.missingPaths.length || env.SCOPE_OUTCOME !== "success")) result.status = "failure";
          }
          const tests = results.filter(({ id, selected }) => selected && ["swift-tests", "gameplay-smoke", "render-battle-preview"].includes(id));
          outcomes.testOutcome = tests.length === 0 ? "skipped" : tests.every(({ status }) => status === "success") ? "success" : "failure";
          const manifest = {
            version: env.CI_VERSION,
            branch,
            commitSha: env.GITHUB_SHA,
            shortSha,
            runId: env.GITHUB_RUN_ID,
            runAttempt: env.GITHUB_RUN_ATTEMPT,
            workflowName: env.GITHUB_WORKFLOW,
            createdAt: new Date().toISOString(),
            projectName: env.PROJECT_NAME,
            scheme: env.XCODE_SCHEME,
            destination: env.XCODE_DESTINATION,
            ...outcomes,
            validationProfile: scope.validationProfile,
            validationScope: scope,
            scopeOutcome: env.SCOPE_OUTCOME,
            selectedChecks: scope.selectedChecks,
            skippedChecks: scope.skippedChecks,
            checkResults: results,
            scopePath,
            resultBundlePath: fs.existsSync(env.RESULT_BUNDLE_PATH) ? env.RESULT_BUNDLE_PATH : null,
            junitPath: "ci-results/junit.xml",
            buildLogPath: fs.existsSync("ci-results/xcodebuild.log") ? "ci-results/xcodebuild.log" : null,
            renderPreviewLogPath: fs.existsSync("ci-results/render-battle-preview.log") ? "ci-results/render-battle-preview.log" : null,
            failureSummaryPath: "ci-results/ci-failure-summary.md",
            projectSpecificReports: results.filter(({ selected, log }) => selected && fs.existsSync(log)).map(({ log }) => log),
            renderPreviewPaths: scope.selectedChecks.includes("render-battle-preview") ? expectedRenderPaths : []
          };
          fs.writeFileSync("ci-results/ci-artifact-manifest.json", JSON.stringify(manifest, null, 2) + "\n");

          const escapeXml = (value) => String(value).replace(/[<>&'"\x00-\x08\x0B\x0C\x0E-\x1F]/g, (ch) => ({
            "<": "&lt;", ">": "&gt;", "&": "&amp;", "'": "&apos;", '"': "&quot;"
          }[ch] || ""));
          const failures = results.filter(({ status }) => status === "failure");
          const skipped = results.filter(({ status }) => status === "skipped");
          const testcases = results.map(({ id, status, outcome, log, reason, missingPaths }) => {
            const detail = status === "skipped" ? `<skipped message="${escapeXml(reason)}"/>`
              : status === "success" ? ""
              : `<failure message="${escapeXml(outcome)}">See ${escapeXml(log)}; missing: ${escapeXml(missingPaths.join(", "))}; scope: ${escapeXml(env.SCOPE_OUTCOME)}</failure>`;
            return `<testcase classname="RomeLegionsCI" name="${escapeXml(id)}">${detail}</testcase>`;
          }).join("");
          fs.writeFileSync("ci-results/junit.xml", `<?xml version="1.0" encoding="UTF-8"?>\n<testsuite name="RomeLegions CI" tests="${results.length}" failures="${failures.length}" skipped="${skipped.length}">${testcases}</testsuite>\n`);

          const summary = [
            "# RomeLegions CI Failure Summary", "",
            `- version: ${env.CI_VERSION}`, `- branch: ${branch}`, `- commitSha: ${env.GITHUB_SHA}`,
            `- runId: ${env.GITHUB_RUN_ID}`, `- runAttempt: ${env.GITHUB_RUN_ATTEMPT}`,
            `- validationProfile: ${scope.validationProfile}`, `- scopeOutcome: ${env.SCOPE_OUTCOME}`,
            ...results.map(({ id, status, outcome, reason, missingPaths }) => `- ${id}: ${status} (actual: ${outcome}); ${reason}; missing: ${missingPaths.join(", ") || "none"}`), "",
            failures.length === 0 ? "All selected CI checks passed. Unselected checks are explicitly skipped." : "One or more selected checks or scope contracts failed. Inspect manifest and logs.", ""
          ].join("\n");
          fs.writeFileSync("ci-results/ci-failure-summary.md", summary);
          fs.appendFileSync(env.GITHUB_OUTPUT, `artifact_name=${artifactName}\nfailed_checks=${failures.length}\n`);
          NODE

      - name: Upload CI result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: ci-results
          if-no-files-found: error
          retention-days: 14

      - name: Fail job on failed checks
        if: always()
        env:
          SCOPE_OUTCOME: ${{ steps.scope.outcome }}
          METADATA_OUTCOME: ${{ steps.metadata.outcome }}
          FAILED_CHECKS: ${{ steps.metadata.outputs.failed_checks }}
        run: |
          if [ "$SCOPE_OUTCOME" != "success" ] || \
             [ "$METADATA_OUTCOME" != "success" ] || \
             [ "$FAILED_CHECKS" != "0" ]; then
            echo "Selected validation failed. Inspect this run's artifact and scope."
            exit 1
          fi
